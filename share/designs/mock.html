<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>share - design mock</title>
<style>
/* Design mock only: no networking, no real transfers. Five layouts of the
   same thing - one card per device, big touch targets. */
html, body { height: 100%; }
body { margin: 0; background-color: #0a0c12; color: #eef1f6;
  font-family: Arial, Helvetica, sans-serif; font-size: 15px; -webkit-text-size-adjust: 100%; }
.page { position: relative; max-width: 560px; min-height: 100%; margin: 0 auto;
  padding: 16px 14px 96px 14px; -webkit-box-sizing: border-box; -moz-box-sizing: border-box; box-sizing: border-box; }
h1 { margin: 0; font-size: 20px; }
h1 span { color: #5fd0e8; }
.sub { margin: 5px 0 16px 0; color: #98a2b3; font-size: 12px; }
.label { margin: 18px 0 8px 0; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: #6d7787; }

/* one device card */
.device { width: 100%; margin: 0 0 10px 0; padding: 14px; background-color: #12161f;
  border: 1px solid #232a38; text-align: left; color: inherit; font-family: inherit;
  -webkit-border-radius: 16px; border-radius: 16px; -webkit-box-sizing: border-box; -moz-box-sizing: border-box; box-sizing: border-box; }
.dname { display: block; font-size: 17px; font-weight: bold; }
.dsub { display: block; margin-top: 2px; font-size: 12px; color: #7f8a9c; }
.chev { float: right; font-size: 24px; line-height: 1; color: #5fd0e8; }

/* big buttons */
.big { display: block; width: 100%; min-height: 54px; margin-top: 10px; padding: 14px;
  font-size: 17px; font-weight: bold; font-family: inherit; color: #06222b; cursor: pointer;
  background-color: #5fd0e8; border: 0; -webkit-border-radius: 14px; border-radius: 14px;
  -webkit-box-sizing: border-box; -moz-box-sizing: border-box; box-sizing: border-box; }
.big.alt { color: #eef1f6; background-color: #1e2736; border: 1px solid #33405a; }

/* a: whole card opens a sheet */
.sheet, .backdrop { display: none; }
.backdrop { position: fixed; left: 0; right: 0; top: 0; bottom: 0; background: rgba(0, 0, 0, 0.55); }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; padding: 16px 14px 20px 14px;
  background-color: #12161f; border-top: 1px solid #2c3648;
  -webkit-border-radius: 20px 20px 0 0; border-radius: 20px 20px 0 0; }
.sheet .who { margin: 0 0 4px 0; font-size: 17px; font-weight: bold; }
.sheet .cancel { margin-top: 12px; text-align: center; color: #98a2b3; font-size: 15px; padding: 12px; }

/* c: two huge halves */
.split { margin-top: 12px; }
.split button { float: left; width: 50%; min-height: 104px; padding: 10px; font-size: 17px; font-weight: bold; text-align: center;
  font-family: inherit; color: #eef1f6; background-color: #1a2130; border: 1px solid #2c3648; cursor: pointer;
  -webkit-box-sizing: border-box; -moz-box-sizing: border-box; box-sizing: border-box; }
.split button:first-child { color: #06222b; background-color: #5fd0e8; border-color: #5fd0e8;
  -webkit-border-radius: 14px 0 0 14px; border-radius: 14px 0 0 14px; }
.split button:last-child { -webkit-border-radius: 0 14px 14px 0; border-radius: 0 14px 14px 0; }
.split .glyph { display: block; font-size: 26px; margin-bottom: 6px; }
.clear { clear: both; }

/* d: select a device, then act from a bar at the bottom */
.device.selected { border-color: #5fd0e8; background-color: #16202c; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 14px 14px 14px;
  background-color: #0d1119; border-top: 1px solid #1b2130; }
.bar .inner { max-width: 560px; margin: 0 auto; }
.bar button { float: left; width: 49%; min-height: 56px; font-size: 17px; font-weight: bold; font-family: inherit;
  cursor: pointer; -webkit-border-radius: 14px; border-radius: 14px; }
.bar button:first-child { margin-right: 2%; color: #06222b; background-color: #5fd0e8; border: 0; }
.bar button:last-child { color: #eef1f6; background-color: #1e2736; border: 1px solid #33405a; }
.bar button[disabled] { opacity: 0.45; }
.bar .hint { clear: both; padding-top: 8px; font-size: 11px; color: #6d7787; text-align: center; }

/* e: device chips + compose area */
.chips { margin: 0 0 14px 0; }
.chip { display: inline-block; min-height: 52px; margin: 0 8px 8px 0; padding: 0 20px; line-height: 50px;
  font-size: 16px; font-weight: bold; color: #dfe6f2; background-color: #12161f; border: 1px solid #232a38;
  -webkit-border-radius: 26px; border-radius: 26px; cursor: pointer; }
.chip.on { color: #06222b; background-color: #5fd0e8; border-color: #5fd0e8; }
textarea { width: 100%; min-height: 96px; padding: 14px; font-size: 16px; font-family: inherit; line-height: 1.45;
  color: #eef1f6; background-color: #12161f; border: 1px solid #232a38; resize: vertical;
  -webkit-border-radius: 14px; border-radius: 14px; -webkit-box-sizing: border-box; -moz-box-sizing: border-box; box-sizing: border-box; }
.drop { margin-top: 10px; padding: 24px 14px; text-align: center; font-size: 16px; color: #cfe9f2;
  background-color: transparent; border: 1px dashed #33405a; cursor: pointer;
  -webkit-border-radius: 14px; border-radius: 14px; }
.drop b { display: block; font-size: 24px; margin-bottom: 6px; }

.toast { position: fixed; left: 14px; right: 14px; bottom: 14px; padding: 14px; text-align: center;
  font-size: 14px; color: #06222b; background-color: #5fd0e8; -webkit-border-radius: 12px; border-radius: 12px;
  display: none; }
.footnote { margin: 22px 0 0 0; font-size: 11px; color: #6d7787; }
</style>
</head>
<body>
<div class="page">
  <h1>aziz.tools <span>/</span> share</h1>
  <p class="sub">Design mock - nothing is transferred here. Tap the controls to feel the sizes.</p>

  <div class="label" id="labelA">Devices nearby</div>
  <div id="devices"></div>

  <div id="compose" style="display:none">
    <div class="label">Text to send</div>
    <textarea id="text" placeholder="Paste or type text, then tap Send"></textarea>
    <button class="big" id="sendText">Send text to <span id="whoText">nobody yet</span></button>
    <div class="drop" id="drop"><b>&#128206;</b>Send files<span style="display:block;font-size:12px;color:#7f8a9c;margin-top:4px">tap to choose, or drag them here</span></div>
  </div>

  <p class="footnote" id="foot">One card per device. Big targets only.</p>
</div>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet">
  <p class="who" id="sheetWho">iPhone</p>
  <div class="sub" style="margin:0 0 4px 0">What do you want to send?</div>
  <button class="big" id="sheetFiles">&#128206; Send files</button>
  <button class="big alt" id="sheetText">&#9998; Send text</button>
  <div class="cancel" id="sheetCancel">Cancel</div>
</div>

<div class="bar" id="bar" style="display:none">
  <div class="inner">
    <button id="barFiles" disabled>&#128206; Files</button>
    <button id="barText" disabled>&#9998; Text</button>
    <div class="hint" id="barHint">Pick a device above</div>
  </div>
</div>

<div class="toast" id="toast">Mock</div>
<script>
(function () {
  "use strict";
  var V = (location.search.match(/[?&]v=([a-e])/) || [])[1] || "a";
  var devices = [
    { name: "Aziz's iPhone", sub: "same WiFi" },
    { name: "MacBook Pro", sub: "same WiFi" }
  ];
  var devicesEl = document.getElementById("devices");
  var selected = null;

  function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.style.display = "block";
    setTimeout(function () { t.style.display = "none"; }, 1600);
  }

  function build() {
    devicesEl.innerHTML = "";
    for (var i = 0; i < devices.length; i++) {
      (function (d, idx) {
        var card = document.createElement("div");
        card.className = "device";
        card.setAttribute("data-idx", idx);
        var name = document.createElement("span");
        name.className = "dname";
        name.textContent = d.name;
        var sub = document.createElement("span");
        sub.className = "dsub";
        sub.textContent = V === "a" ? "Tap to send files or text" : d.sub;
        card.appendChild(name);
        card.appendChild(sub);
        if (V === "a" || V === "d") {
          var chev = document.createElement("span");
          chev.className = "chev";
          chev.innerHTML = "&#8250;";
          card.insertBefore(chev, name);
        }

        if (V === "b") {
          var f = document.createElement("button");
          f.className = "big";
          f.innerHTML = "&#128206; Send files";
          f.onclick = function () { toast("File picker would open for " + d.name); };
          var t = document.createElement("button");
          t.className = "big alt";
          t.innerHTML = "&#9998; Send text";
          t.onclick = function () { toast("Text would go to " + d.name); };
          card.appendChild(f);
          card.appendChild(t);
        } else if (V === "c") {
          var split = document.createElement("div");
          split.className = "split";
          var b1 = document.createElement("button");
          b1.innerHTML = "<span class='glyph'>&#128206;</span>Files";
          b1.onclick = function () { toast("File picker would open for " + d.name); };
          var b2 = document.createElement("button");
          b2.innerHTML = "<span class='glyph'>&#9998;</span>Text";
          b2.onclick = function () { toast("Text would go to " + d.name); };
          split.appendChild(b1);
          split.appendChild(b2);
          card.appendChild(split);
          var clr = document.createElement("div");
          clr.className = "clear";
          card.appendChild(clr);
        } else if (V === "d") {
          card.onclick = function () {
            selected = idx;
            var all = devicesEl.querySelectorAll(".device");
            for (var k = 0; k < all.length; k++) all[k].className = "device";
            card.className = "device selected";
            document.getElementById("barHint").textContent = "Sending to " + d.name;
            document.getElementById("barFiles").disabled = false;
            document.getElementById("barText").disabled = false;
          };
        } else if (V === "a") {
          card.onclick = function () {
            document.getElementById("sheetWho").textContent = "Send to " + d.name;
            document.getElementById("sheet").style.display = "block";
            document.getElementById("backdrop").style.display = "block";
            selected = idx;
          };
        }
        devicesEl.appendChild(card);
      })(devices[i], i);
    }
  }

  function closeSheet() {
    document.getElementById("sheet").style.display = "none";
    document.getElementById("backdrop").style.display = "none";
  }
  document.getElementById("backdrop").onclick = closeSheet;
  document.getElementById("sheetCancel").onclick = closeSheet;
  document.getElementById("sheetFiles").onclick = function () {
    toast("File picker would open for " + devices[selected].name);
    closeSheet();
  };
  document.getElementById("sheetText").onclick = function () {
    closeSheet();
    document.getElementById("compose").style.display = "block";
    document.getElementById("whoText").textContent = devices[selected].name;
    document.getElementById("text").focus();
  };

  if (V === "d") {
    document.getElementById("bar").style.display = "block";
    document.getElementById("barFiles").onclick = function () { toast("File picker would open for " + devices[selected].name); };
    document.getElementById("barText").onclick = function () { toast("Text would go to " + devices[selected].name); };
  }

  if (V === "e") {
    document.getElementById("labelA").textContent = "Choose a device";
    var sendBtn = document.getElementById("sendText");
    sendBtn.disabled = true;
    sendBtn.style.opacity = "0.45";
    var chips = document.createElement("div");
    chips.className = "chips";
    for (var i = 0; i < devices.length; i++) {
      (function (d, idx) {
        var chip = document.createElement("button");
        chip.className = "chip";
        chip.textContent = d.name;
        chip.onclick = function () {
          var all = chips.querySelectorAll(".chip");
          for (var k = 0; k < all.length; k++) all[k].className = "chip";
          chip.className = "chip on";
          selected = idx;
          document.getElementById("whoText").textContent = d.name;
          document.getElementById("barHint").textContent = "Sending to " + d.name;
          sendBtn.disabled = false;
          sendBtn.style.opacity = "1";
        };
        chips.appendChild(chip);
      })(devices[i], i);
    }
    document.getElementById("devices").parentNode.insertBefore(chips, document.getElementById("devices"));
    devicesEl.style.display = "none";
    document.getElementById("compose").style.display = "block";
    document.getElementById("sendText").onclick = function () {
      if (selected === null) { toast("Pick a device chip first"); return; }
      toast("Text would go to " + devices[selected].name);
    };
    document.getElementById("drop").onclick = function () {
      if (selected === null) { toast("Pick a device chip first"); return; }
      toast("File picker would open for " + devices[selected].name);
    };
  }

  build();
})();
</script>
</body>
</html>
