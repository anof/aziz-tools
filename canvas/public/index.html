<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>canvas - aziz.tools</title>
<meta name="description" content="An infinite canvas for your finger. One finger draws, two fingers move and zoom.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; width: 100%; height: 100%;
  background: #000; overflow: hidden; overscroll-behavior: none;
}
body {
  position: fixed; inset: 0;
  touch-action: none;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  font-family: Arial, Helvetica, sans-serif;
}
#canvas {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  display: block; touch-action: none;
}
#toolbar {
  position: absolute; z-index: 2;
  left: 16px; top: calc(16px + env(safe-area-inset-top, 0px));
  display: flex; flex-direction: column; gap: 8px;
}
#toolbar button {
  width: 48px; height: 48px; margin: 0; padding: 0;
  display: flex; align-items: center; justify-content: center;
  color: #fff; cursor: pointer;
  background: rgba(255, 255, 255, 0.15);
  border: 1px solid rgba(255, 255, 255, 0.2);
  -webkit-border-radius: 18px; border-radius: 18px;
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  transition: transform 0.12s ease, background-color 0.15s ease, border-color 0.15s ease;
  -webkit-tap-highlight-color: transparent;
}
#toolbar button:active { transform: scale(0.9); }
#toolbar button:focus-visible { outline: 2px solid #00A8FF; outline-offset: 3px; }
#toolbar button.active {
  background: #00A8FF; border-color: #00A8FF; color: #000;
}
#toolbar svg { width: 24px; height: 24px; display: block; }
#hint {
  position: absolute; z-index: 2; left: 50%;
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  padding: 8px 13px;
  font-size: 12px; color: rgba(255, 255, 255, 0.62);
  background: rgba(0, 0, 0, 0.55);
  border: 1px solid rgba(255, 255, 255, 0.1);
  -webkit-border-radius: 999px; border-radius: 999px;
  white-space: nowrap; pointer-events: none;
  animation: hintFade 8s ease forwards;
}
@keyframes hintFade {
  0%, 65% { opacity: 1; }
  100% { opacity: 0; }
}
#home {
  position: absolute; z-index: 2; right: 14px;
  top: calc(18px + env(safe-area-inset-top, 0px));
  font-size: 11px; letter-spacing: 0.02em;
  color: rgba(255, 255, 255, 0.32); text-decoration: none;
}
#home:active { color: rgba(255, 255, 255, 0.6); }
@media (prefers-reduced-motion: reduce) {
  #hint { animation: none; opacity: 0.8; }
  #toolbar button { transition: none; }
}
</style>
</head>
<body>

<svg id="canvas" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Infinite drawing canvas">
  <g id="world">
    <g id="strokes"></g>
    <path id="active" fill="none" stroke="#00A8FF" stroke-width="4"
          stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"></path>
  </g>
</svg>

<div id="toolbar">
  <button id="eraser" type="button" aria-label="Eraser" aria-pressed="false" title="Eraser">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 20h9"></path>
      <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path>
    </svg>
  </button>
  <button id="clear" type="button" aria-label="Clear canvas" title="Clear">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 6h18"></path>
      <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path>
      <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
    </svg>
  </button>
</div>

<div id="hint">One finger draws &middot; Two fingers move &amp; zoom</div>
<a id="home" href="https://aziz.tools">aziz.tools</a>

<script>
(function () {
  "use strict";

  var NS = "http://www.w3.org/2000/svg";
  var svg = document.getElementById("canvas");
  var world = document.getElementById("world");
  var strokesEl = document.getElementById("strokes");
  var activeEl = document.getElementById("active");
  var eraserBtn = document.getElementById("eraser");
  var clearBtn = document.getElementById("clear");

  var STROKE_COLOR = "#00A8FF";
  var STROKE_WIDTH = 4;
  var ERASER_RADIUS = 25;
  var MIN_SCALE = 0.1;
  var MAX_SCALE = 10;

  /* Infinite canvas transform: world is panned by (ox, oy) and scaled. */
  var scale = 1;
  var ox = 0;
  var oy = 0;

  var eraser = false;
  var drawing = false;
  var erasing = false;
  var points = [];
  var lastScreen = null;
  var gesture = null;
  var gestureLocked = false;
  var frameQueued = false;
  var lastTouchAt = 0;

  function haptic(ms) {
    try { if (navigator.vibrate) navigator.vibrate(ms || 10); } catch (e) {}
  }

  function clamp(v, lo, hi) {
    return v < lo ? lo : v > hi ? hi : v;
  }

  function applyTransform() {
    world.setAttribute(
      "transform",
      "translate(" + ox.toFixed(3) + " " + oy.toFixed(3) + ") scale(" + scale.toFixed(5) + ")"
    );
  }

  function screenPoint(e) {
    var r = svg.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  function toWorld(p) {
    return { x: (p.x - ox) / scale, y: (p.y - oy) / scale };
  }

  function pathData(pts) {
    if (!pts.length) return "";
    var d = "M " + pts[0].x.toFixed(2) + " " + pts[0].y.toFixed(2);
    for (var i = 1; i < pts.length; i++) {
      d += " L " + pts[i].x.toFixed(2) + " " + pts[i].y.toFixed(2);
    }
    /* A tap should leave a dot. */
    if (pts.length === 1) {
      d += " L " + (pts[0].x + 0.01).toFixed(2) + " " + pts[0].y.toFixed(2);
    }
    return d;
  }

  function queueActiveRender() {
    if (frameQueued) return;
    frameQueued = true;
    requestAnimationFrame(function () {
      frameQueued = false;
      if (drawing) activeEl.setAttribute("d", pathData(points));
    });
  }

  function beginStroke(s) {
    var w = toWorld(s);
    points = [w];
    lastScreen = s;
    drawing = true;
    activeEl.setAttribute("d", pathData(points));
  }

  function extendStroke(s) {
    if (!drawing) return;
    if (lastScreen) {
      var dx = s.x - lastScreen.x;
      var dy = s.y - lastScreen.y;
      if (dx * dx + dy * dy < 1.44) return;   /* ~1.2 screen px */
    }
    points.push(toWorld(s));
    lastScreen = s;
    queueActiveRender();
  }

  function cancelStroke() {
    drawing = false;
    points = [];
    lastScreen = null;
    activeEl.setAttribute("d", "");
  }

  function commitStroke() {
    if (!drawing) return;
    drawing = false;
    if (points.length) {
      var p = document.createElementNS(NS, "path");
      p.setAttribute("d", pathData(points));
      p.setAttribute("fill", "none");
      p.setAttribute("stroke", STROKE_COLOR);
      p.setAttribute("stroke-width", String(STROKE_WIDTH));
      p.setAttribute("stroke-linecap", "round");
      p.setAttribute("stroke-linejoin", "round");
      p.setAttribute("vector-effect", "non-scaling-stroke");
      p.__pts = points;
      strokesEl.appendChild(p);
    }
    points = [];
    lastScreen = null;
    activeEl.setAttribute("d", "");
  }

  /* ---------- eraser ---------- */

  function distToSegment(p, a, b) {
    var vx = b.x - a.x;
    var vy = b.y - a.y;
    var wx = p.x - a.x;
    var wy = p.y - a.y;
    var len2 = vx * vx + vy * vy;
    var t = len2 ? clamp((wx * vx + wy * vy) / len2, 0, 1) : 0;
    var dx = p.x - (a.x + t * vx);
    var dy = p.y - (a.y + t * vy);
    return Math.sqrt(dx * dx + dy * dy);
  }

  function hitsPath(pts, w, radius) {
    if (!pts || !pts.length) return false;
    for (var i = 0; i < pts.length; i++) {
      var dx = pts[i].x - w.x;
      var dy = pts[i].y - w.y;
      if (dx * dx + dy * dy <= radius * radius) return true;
      if (i > 0 && distToSegment(w, pts[i - 1], pts[i]) <= radius) return true;
    }
    return false;
  }

  function eraseAt(s) {
    var w = toWorld(s);
    var radius = ERASER_RADIUS / scale;
    for (var i = strokesEl.children.length - 1; i >= 0; i--) {
      var path = strokesEl.children[i];
      if (hitsPath(path.__pts, w, radius)) strokesEl.removeChild(path);
    }
  }

  /* ---------- two finger pan + pinch ---------- */

  function twoPoints(touches) {
    return [screenPoint(touches[0]), screenPoint(touches[1])];
  }

  function beginGesture(touches) {
    var p = twoPoints(touches);
    gesture = {
      distance: Math.max(1, Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y)),
      midX: (p[0].x + p[1].x) / 2,
      midY: (p[0].y + p[1].y) / 2,
      scale: scale,
      ox: ox,
      oy: oy
    };
  }

  function moveGesture(touches) {
    if (!gesture) beginGesture(touches);
    var p = twoPoints(touches);
    var distance = Math.max(1, Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y));
    var midX = (p[0].x + p[1].x) / 2;
    var midY = (p[0].y + p[1].y) / 2;
    var nextScale = clamp(gesture.scale * (distance / gesture.distance), MIN_SCALE, MAX_SCALE);

    /* Keep the world point that was under the starting midpoint under the
       current midpoint: this pans and zooms in one gesture. */
    var wx = (gesture.midX - gesture.ox) / gesture.scale;
    var wy = (gesture.midY - gesture.oy) / gesture.scale;
    ox = midX - wx * nextScale;
    oy = midY - wy * nextScale;
    scale = nextScale;
    applyTransform();
  }

  function zoomAt(s, nextScale) {
    nextScale = clamp(nextScale, MIN_SCALE, MAX_SCALE);
    var wx = (s.x - ox) / scale;
    var wy = (s.y - oy) / scale;
    scale = nextScale;
    ox = s.x - wx * scale;
    oy = s.y - wy * scale;
    applyTransform();
  }

  /* ---------- touch input ---------- */

  function onTouchStart(e) {
    e.preventDefault();
    lastTouchAt = Date.now();

    if (e.touches.length >= 2) {
      /* A second finger always takes over, even mid-stroke. */
      cancelStroke();
      gestureLocked = true;
      beginGesture(e.touches);
      return;
    }

    if (gestureLocked || !e.touches.length) return;
    var s = screenPoint(e.touches[0]);
    if (eraser) eraseAt(s);
    else beginStroke(s);
  }

  function onTouchMove(e) {
    e.preventDefault();
    lastTouchAt = Date.now();

    if (e.touches.length >= 2) {
      if (drawing) cancelStroke();
      gestureLocked = true;
      moveGesture(e.touches);
      return;
    }

    if (gestureLocked || !e.touches.length) return;
    var s = screenPoint(e.touches[0]);
    if (eraser) eraseAt(s);
    else extendStroke(s);
  }

  function onTouchEnd(e) {
    e.preventDefault();
    lastTouchAt = Date.now();

    if (e.touches.length >= 2) return;
    if (e.touches.length === 1) {
      /* One finger left after a pinch: do not turn the leftover into a stroke. */
      if (gesture || gestureLocked) {
        gesture = null;
        gestureLocked = true;
      }
      return;
    }

    if (drawing) commitStroke();
    cancelStroke();
    gesture = null;
    gestureLocked = false;
  }

  svg.addEventListener("touchstart", onTouchStart, { passive: false });
  svg.addEventListener("touchmove", onTouchMove, { passive: false });
  svg.addEventListener("touchend", onTouchEnd, { passive: false });
  svg.addEventListener("touchcancel", function (e) {
    e.preventDefault();
    cancelStroke();
    gesture = null;
    gestureLocked = false;
  }, { passive: false });

  /* Stop Safari's own page pinch/double-tap handling outside the canvas too. */
  document.addEventListener("gesturestart", function (e) { e.preventDefault(); }, { passive: false });

  /* ---------- mouse + trackpad (desktop) ---------- */

  svg.addEventListener("mousedown", function (e) {
    if (e.button !== 0 || Date.now() - lastTouchAt < 700) return;
    e.preventDefault();
    var s = screenPoint(e);
    if (eraser) {
      erasing = true;
      eraseAt(s);
    } else {
      beginStroke(s);
    }
  });

  window.addEventListener("mousemove", function (e) {
    if (Date.now() - lastTouchAt < 700) return;
    if (erasing) eraseAt(screenPoint(e));
    else if (drawing) extendStroke(screenPoint(e));
  });

  window.addEventListener("mouseup", function () {
    if (erasing) erasing = false;
    if (drawing) commitStroke();
  });

  svg.addEventListener("wheel", function (e) {
    e.preventDefault();
    if (e.ctrlKey || e.metaKey) {
      var factor = Math.exp(-e.deltaY * 0.0025);
      zoomAt(screenPoint(e), scale * factor);
    } else {
      /* Trackpad two-finger scroll pans the infinite canvas. */
      ox -= e.deltaX;
      oy -= e.deltaY;
      applyTransform();
    }
  }, { passive: false });

  /* ---------- toolbar ---------- */

  eraserBtn.addEventListener("click", function () {
    eraser = !eraser;
    eraserBtn.classList.toggle("active", eraser);
    eraserBtn.setAttribute("aria-pressed", eraser ? "true" : "false");
    cancelStroke();
    haptic(10);
  });

  clearBtn.addEventListener("click", function () {
    strokesEl.innerHTML = "";
    cancelStroke();
    haptic(20);
  });

  applyTransform();
})();
</script>
</body>
</html>
