<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>aziz.tools</title>
    <meta name="description" content="Small tools, one place. Pick a tool and go." />
    <meta name="theme-color" content="#08090d" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="glow glow--one" aria-hidden="true"></div>
    <div class="glow glow--two" aria-hidden="true"></div>

    <main class="page">
      <header class="masthead">
        <h1 class="wordmark">
          <span class="wordmark__dot" aria-hidden="true"></span>
          aziz<span class="wordmark__tld">.tools</span>
        </h1>
        <p class="tagline">Small tools. One place. Tap one to open it.</p>
      </header>

      <nav class="tools" aria-label="Tools">
        <a class="tile tile--live" href="https://share.aziz.tools">
          <span class="tile__badge" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="18" cy="5" r="2.6" />
              <circle cx="6" cy="12" r="2.6" />
              <circle cx="18" cy="19" r="2.6" />
              <path d="M8.4 10.7 15.6 6.3" />
              <path d="M8.4 13.3 15.6 17.7" />
            </svg>
          </span>
          <span class="tile__text">
            <span class="tile__name">Share</span>
            <span class="tile__host">share.aziz.tools</span>
          </span>
          <span class="tile__arrow" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M7 17 17 7" />
              <path d="M9 7h8v8" />
            </svg>
          </span>
        </a>

        <a class="tile tile--live" href="https://shade.aziz.tools">
          <span class="tile__badge" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="4.2" />
              <path d="M12 2.6v2.2" />
              <path d="M12 19.2v2.2" />
              <path d="M2.6 12h2.2" />
              <path d="M19.2 12h2.2" />
              <path d="M5.4 5.4 7 7" />
              <path d="M17 17l1.6 1.6" />
              <path d="M18.6 5.4 17 7" />
              <path d="M7 17l-1.6 1.6" />
            </svg>
          </span>
          <span class="tile__text">
            <span class="tile__name">Shade</span>
            <span class="tile__host">shade.aziz.tools</span>
          </span>
          <span class="tile__arrow" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M7 17 17 7" />
              <path d="M9 7h8v8" />
            </svg>
          </span>
        </a>

        <div class="tile tile--soon">
          <span class="tile__badge" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 5v14" />
              <path d="M5 12h14" />
            </svg>
          </span>
          <span class="tile__text">
            <span class="tile__name">Next tool</span>
            <span class="tile__host">Coming soon</span>
          </span>
        </div>

        <div class="tile tile--soon">
          <span class="tile__badge" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 5v14" />
              <path d="M5 12h14" />
            </svg>
          </span>
          <span class="tile__text">
            <span class="tile__name">Next tool</span>
            <span class="tile__host">Coming soon</span>
          </span>
        </div>
      </nav>

      <footer class="footer">
        <span>&copy; 2026 aziz.tools</span>
      </footer>
    </main>
  </body>
</html>
